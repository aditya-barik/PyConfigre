# ─────────────────────────────────────────────────────────────────────────────
# Python Package CI
#
# The primary CI pipeline. Runs on every push to main/dev and on every PR
# targeting main/dev. Executes five jobs in sequence:
#
#   lint       — Ruff static analysis; uploads results as an artifact
#   types      — MyPy strict type checking
#   test       — pytest unit tests across Python 3.10–3.14 (matrix)
#                uploads per-version coverage reports to Codecov
#   build      — builds the wheel; uploads as an artifact
#   integration — installs the built wheel into a clean venv and runs
#                 integration tests against Python 3.10 (minimum supported)
#
# Job dependency chain:
#   lint ─┐
#         ├─→ test ─→ build ─→ integration
#   types ┘
#
# Version constants are centralised in the top-level env: block.
# Python is installed via actions/setup-python; uv manages the venv.
#
# Triggered by : push to main/dev, pull_request targeting main/dev
# ─────────────────────────────────────────────────────────────────────────────

name: Python Package CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  UV_VERSION: "0.9.2"
  INTEGRATION_PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Project Dependencies
        run: uv sync --extra dev --frozen

      - name: Check Code Formatting with Ruff
        run: |
          echo "🧹 Checking code formatting with Ruff..."
          uv run ruff check src/ tests/ --statistics --output-file=ci-results/ruff.md

      - name: Upload Ruff Results
        uses: actions/upload-artifact@v6
        with:
          name: Ruff Results
          path: ci-results/ruff.md
          retention-days: 30

  types:
    name: Static Type Checks (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Project Dependencies
        run: uv sync --extra dev --frozen

      - name: Run MyPy
        run: |
          echo "🛡️ Type checking with MyPy..."
          uv run mypy src/

  test:
    runs-on: ubuntu-latest
    needs: [lint, types]
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    name: Package Test using Python ${{ matrix.python-version }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the Project Dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with PyTest..."
          uv run pytest -m "not integration" \
            --cov-report=xml:.pytest/results/coverage-${{ matrix.python-version }}.xml \
            --cov-report=markdown:.pytest/results/coverage-${{ matrix.python-version }}.md \
            -v
        continue-on-error: false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aditya-barik/PyConfigre
          files: .pytest/results/coverage-${{ matrix.python-version }}.xml

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the package
        run: |
          echo "📦 Building the package..."
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: ./dist/*.whl
          retention-days: 30

  integration:
    name: Package Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.INTEGRATION_PYTHON_VERSION }}

      - name: Setup UV
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: artifacts/build/

      - name: Install the package
        run: |
          uv venv
          uv pip install artifacts/build/$(ls artifacts/build/ | grep .whl)
          uv pip install pytest pytest-cov

      - name: Run PyConfigre Integration Test
        run: |
          echo "🧪 Running PyConfigre Integration Test..."
          uv run pytest -m integration -v
        continue-on-error: false
